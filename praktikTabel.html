<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praktik Tabel</title>
</head>
<body>
    <table border="1">
        <tr>
            <th>No</th>
            <th>Nama</th>
            <th>Kelas</th>
        </tr>
        <tr>
            <td>1</td>
            <td>Ahamd</td>
            <td>90</td>
        </tr>
        <tr>
            <td>2</td>
            <td>Budi</td>
            <td>85</td>
        </tr>
    </table>
    <hr>
    <table border="1">
        <tr>
            <th rowspan="2">No</th>
            <th rowspan="2">Nama</th>
            <th colspan="3">Nilai Mapel</th>
        </tr>
        <tr>
            <td>Mat</td>
            <td>Bindo</td>
            <td>Produktif</td>
        </tr>
    </table>
</body>
</html>
